name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 開発機は Node 18 だが、一部の依存が Node 20+ を要求し始めている。
        # 18 を落とす前に、20 / 22 で緑であることを先に担保しておく。
        node: [20, 22]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: 要件の追跡表（modal.skill.md との対応）
        run: npm run check:trace

      - name: 文書のコード例がコンパイルできるか
        run: npm run check:docs

      - name: Build
        run: npm run build

      - name: Check dist (size budget / "use client" / public API)
        run: npm run check:dist

      - name: SSR smoke test (Next.js App Router 互換)
        run: npm run check:ssr

      # publish の瞬間まで気づけない事故（access 未設定・LICENSE 欠落・
      # 同梱文書のリンク切れ・types 条件の取り違え）を、毎 PR で落とす。
      - name: Check publishable package
        run: npm run check:pack

      - name: Build demo
        run: npm run build:demo

      # 仕様書・追跡表・型定義から表を組み立てるので、文書の書式が崩れるとここで落ちる。
      - name: Build documentation site
        run: npm run site:build

  # 日本語・中国語・韓国語の折り返しを、実ブラウザで改行位置を測って確かめる（W-01〜W-05）。
  # jsdom はレイアウトを持たないので単体テストでは書けない。全ページ・全言語・4 つの幅・デモのモーダルを開く。
  line-breaks:
    runs-on: ubuntu-latest
    # ふだんは 20 分前後（崩れがあると、はみ出した要素を探すので 40 分ほど）。apt のミラーが止まり、
    # 既定の上限の 6 時間まで待ったことがある（2026-10-22）ので、1 時間で打ち切る。
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # サイトはシステムフォントで描くので、CJK のフォントが無いと豆腐になり、幅が実機とかけ離れる。
      - name: Install CJK fonts
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-noto-cjk
        timeout-minutes: 10

      - run: npm ci
      - run: npm run site:build
      - name: Check line breaks in the documentation site
        run: npm run check:breaks
        env:
          CHROME_PATH: /usr/bin/google-chrome

  # 利用者の立場からの検証。tarball を実インストールし、ESM / CJS / CSS が引けるか、
  # bundler / node16 / nodenext の3方式すべてで型が解決できるかを見る。
  # ネットワークを使うので verify とは別ジョブにしてある。
  consumer:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm run check:consumer
